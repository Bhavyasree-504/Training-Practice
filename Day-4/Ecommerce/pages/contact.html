<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Think Mart - Contact</title>

    <link rel="icon" type="image/x-icon"
        href="https://www.onlinelogomaker.com/blog/wp-content/uploads/2017/06/shopping-online.jpg">

    <link rel="stylesheet" href="../Styles/index.css">

</head>

<body>

    <header>

        <img
            src="https://www.onlinelogomaker.com/blog/wp-content/uploads/2017/06/shopping-online.jpg"
            alt="Think Mart Logo">

        <nav>

            <ol>

                <li><a href="./index.html">Home</a></li>
                <li><a href="./products.html">Products</a></li>
                <li><a href="./cart.html">Cart</a></li>
                <li><a href="./about.html">About</a></li>
                <li><a href="./contact.html">Contact</a></li>
                <li><a href="./logout.html">Logout</a></li>

            </ol>

        </nav>

    </header>


    <main id="contact-page">

        <h1>Contact <span>Think Mart</span></h1>


        <section class="contact-card">

            <h2>Connect with us</h2>


            <div class="contact-layout">


                <!-- Form -->

                <div class="contact-form">

                    <h3>Send your request</h3>

                    <form>

                        <div class="contact-input-row">

                            <div>
                                <label>Name</label>
                                <input
                                    type="text"
                                    placeholder="Your Name"
                                    required>
                            </div>

                            <div>
                                <label>Phone</label>
                                <input
                                    type="tel"
                                    placeholder="+91 XXXXX XXXXX"
                                    required>
                            </div>

                        </div>


                        <div class="contact-input-row">

                            <div>
                                <label>Email</label>
                                <input
                                    type="email"
                                    placeholder="Your Email"
                                    required>
                            </div>

                            <div>
                                <label>Subject</label>
                                <input
                                    type="text"
                                    placeholder="Subject"
                                    required>
                            </div>

                        </div>


                        <label>Message</label>

                        <textarea
                            placeholder="Your Message"
                            rows="4"
                            required></textarea>


                        <button type="submit">
                            SEND
                        </button>

                    </form>

                </div>


                <!-- Contact Details -->

                <div class="contact-details">

                    <h3>Reach us</h3>

                    <div>
                        <b>Email</b>
                        <p>support@thinkmart.com</p>
                    </div>

                    <div>
                        <b>Phone</b>
                        <p>+91 98765 43210</p>
                    </div>

                    <div>
                        <b>Address</b>
                        <p>
                            Think Mart<br>
                            India
                        </p>
                    </div>

                </div>

            </div>

        </section>

    </main>


    <footer>

        <h2>Our Brands</h2>

        <div class="company-logos">

            <img src="https://upload.wikimedia.org/wikipedia/commons/2/24/Samsung_Logo.svg"
                alt="Samsung">

            <img src="https://upload.wikimedia.org/wikipedia/commons/2/24/HP_logo_2012.svg"
                alt="HP">

            <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg"
                alt="Apple">

            <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg"
                alt="Microsoft">

            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg"
                alt="Amazon">

            <img src="https://upload.wikimedia.org/wikipedia/commons/9/95/Flipkart_logo.svg"
                alt="Flipkart">

        </div>

        <p>© 2026 Think Mart. All Rights Reserved.</p>

    </footer>

</body>

</html>
